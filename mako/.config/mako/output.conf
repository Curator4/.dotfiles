# Pin notifications to the main monitor instead of following focus.
# Concatenated after layout.conf and BEFORE theme colors / category snippets,
# since options after a [criteria] section header stop being global.
# Edited by hand? Also edit ~/.dotfiles/bin/.bin/theme-switcher.sh.
output=DP-3

# Override the layout 5s default; category overrides below still win.
default-timeout=10000
