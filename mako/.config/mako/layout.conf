# Shared mako chrome — Tight masthead, top-right.
# Colors come from themes/<name>/mako.conf (concatenated after this file).
# Edited by hand? Also edit theme-switcher.sh (compose order) and
# theme-scaffold write_mako (colors only).

font=Adwaita Sans 11
format=<span size="14336"><b>%s</b></span>\n%b
text-alignment=center

width=360
height=400
padding=8,16,12
margin=10
border-size=2
border-radius=0
anchor=top-right

# icon-location stays default (left). Top + text-alignment=center double-offsets
# short toasts — mako centers the ink *and* the layout.
icons=1
max-icon-size=32
icon-border-radius=0
icon-path=/usr/share/icons/Adwaita

group-by=app-name
max-visible=5
ignore-timeout=0
default-timeout=5000
