# agent-cue — harness turn-complete toasts (not household-agent identity).
# Concatenated after household-categories by theme-switcher.sh.

# Clicking a toast jumps to the agent's window and clears its cue. Mako's exec
# leaves the toast up; agent-cue closes it.
[app-name=agent-cue]
on-button-left=exec "$HOME/.local/bin/agent-cue" goto --mako-id "$id"

[category=agent.done]
border-color=#62A0B8
default-timeout=8000

# Requests pin until resolved — the session's next cue or `agent-cue seen`
# dismisses them — so this timeout is only an orphan backstop for sessions
# that die with a question pending.
[category=agent.request]
border-color=#7078C0
default-timeout=600000

# Standalone completion palettes. agent-cue keeps category=agent.done for the
# timeout/layout contract and carries the originating terminal theme separately.
[desktop-entry=agent-cue-theme-aegis]
background-color=#282828E6
text-color=#EBDBB2FF
border-color=#D79921FF

