<!doctype html>
<!-- Three Caelestia-inspired right-edge fan rails, switchable via ?variant=G. PROTOTYPE ONLY. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fan edge rail prototype</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --ease-out: cubic-bezier(.2, .8, .2, 1);

      /* Calliope roles, copied from themes/calliope/theme.json for this prototype. */
      --theme-bg: #08090b;
      --theme-fg: #b4bac2;
      --theme-black: #14161a;
      --theme-selection: #1d2b45;
      --theme-muted: #3c4558;
      --theme-red: #6473a8;
      --theme-green: #62a0b8;
      --theme-yellow: #8ca3cc;
      --theme-blue: #3e6fa8;
      --theme-magenta: #7078c0;
      --theme-cyan: #5b8fc7;
      --theme-bright-red: #8c9ac4;
      --theme-bright-green: #8fbfd4;
      --theme-bright-yellow: #b4c4e2;
      --theme-bright-blue: #5b93d6;
      --theme-bright-magenta: #9aa0d8;
      --theme-bright-cyan: #82aee0;
    }

    body[data-theme="neon"] {
      --theme-bg: #0d1117;
      --theme-fg: #d8e8ff;
      --theme-black: #161b22;
      --theme-selection: #1f3a5f;
      --theme-muted: #3a4358;
      --theme-red: #ff2d95;
      --theme-green: #00ffb3;
      --theme-yellow: #ffd166;
      --theme-blue: #00b3ff;
      --theme-magenta: #ff5eb8;
      --theme-cyan: #00f0ff;
      --theme-bright-red: #ff5fb0;
      --theme-bright-green: #5affc7;
      --theme-bright-yellow: #ffe27a;
      --theme-bright-blue: #5ad1ff;
      --theme-bright-magenta: #ff9ad6;
      --theme-bright-cyan: #7afcff;
    }

    body[data-theme="cyber"] {
      --theme-bg: #0a131c;
      --theme-fg: #a0b4c5;
      --theme-black: #111d28;
      --theme-selection: #18324e;
      --theme-muted: #475772;
      --theme-red: #905f59;
      --theme-green: #5e8c9c;
      --theme-yellow: #d9c5a8;
      --theme-blue: #3d6390;
      --theme-magenta: #6e6a9c;
      --theme-cyan: #7297bb;
      --theme-bright-red: #bc8d73;
      --theme-bright-green: #7ba6b5;
      --theme-bright-yellow: #e6d7be;
      --theme-bright-blue: #6298d1;
      --theme-bright-magenta: #8172a7;
      --theme-bright-cyan: #9bb0d7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--theme-bg);
    }

    button {
      border: 0;
      color: inherit;
      font: inherit;
    }

    .desktop {
      position: fixed;
      inset: 0;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(circle at 24% 22%, color-mix(in srgb, var(--theme-blue) 28%, transparent), transparent 28%),
        radial-gradient(circle at 70% 76%, color-mix(in srgb, var(--theme-magenta) 22%, transparent), transparent 31%),
        linear-gradient(145deg, color-mix(in srgb, var(--theme-bg) 88%, var(--theme-muted)) 0%, var(--theme-bg) 58%, color-mix(in srgb, var(--theme-bg) 91%, var(--theme-magenta)) 100%);
    }

    .desktop::before {
      position: absolute;
      inset: 0;
      content: "";
      opacity: .2;
      background-image:
        linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
      background-size: 5.5rem 5.5rem;
      mask-image: linear-gradient(to bottom, #000, transparent 68%);
    }

    .hud-context {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 10.9%;
      border-bottom: 1px solid color-mix(in srgb, var(--theme-muted) 30%, transparent);
      background: linear-gradient(to bottom, color-mix(in srgb, var(--theme-bg) 94%, transparent), color-mix(in srgb, var(--theme-bg) 44%, transparent));
    }

    .hud-context::after {
      position: absolute;
      right: 5.5vw;
      bottom: 1.4rem;
      color: color-mix(in srgb, var(--theme-fg) 26%, transparent);
      content: "DP-4  /  FAN QUICK CONTROL";
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: clamp(9px, .68vw, 14px);
      letter-spacing: .14em;
    }

    .ambient-card {
      position: absolute;
      top: 18%;
      bottom: 12%;
      left: 8%;
      width: 58%;
      border: 1px solid color-mix(in srgb, var(--theme-muted) 22%, transparent);
      border-radius: 2rem;
      opacity: .44;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px) 0 0 / 25% 100%,
        linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px) 0 0 / 100% 12.5%,
        color-mix(in srgb, var(--theme-black) 64%, transparent);
      box-shadow: 0 2rem 8rem rgba(0, 0, 0, .26);
    }

    .ambient-card::before {
      position: absolute;
      top: 2rem;
      left: 2rem;
      width: 31%;
      height: .55rem;
      border-radius: 999px;
      content: "";
      background: color-mix(in srgb, var(--theme-fg) 10%, transparent);
      box-shadow:
        0 1.7rem 0 color-mix(in srgb, var(--theme-fg) 6%, transparent),
        0 3.4rem 0 color-mix(in srgb, var(--theme-fg) 3.5%, transparent);
    }

    .variant {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
    }

    body[data-variant="G"] .variant-g,
    body[data-variant="H"] .variant-h,
    body[data-variant="I"] .variant-i {
      display: block;
    }

    .rail-shell {
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      pointer-events: auto;
      animation: summon .52s var(--ease-out) both;
    }

    @keyframes summon {
      from {
        opacity: .4;
        transform: translateX(112%);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    body.capture .rail-shell {
      animation: none !important;
    }

    .icon-stack {
      position: absolute;
      top: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-50%);
    }

    .stack-trace {
      position: absolute;
      top: 2%;
      bottom: 2%;
      left: 50%;
      z-index: 0;
      width: 1px;
      content: "";
      opacity: .55;
      pointer-events: none;
      background: var(--theme-blue);
    }

    .fan-command {
      --button-accent: var(--theme-blue);
      position: relative;
      z-index: 1;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      cursor: pointer;
      outline: none;
      transition:
        color 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease,
        transform 150ms ease;
    }

    .fan-command:hover {
      transform: scale(1.055);
    }

    .fan-command:active {
      transform: scale(.94);
    }

    .fan-command:focus-visible {
      box-shadow: 0 0 0 2px var(--theme-bg), 0 0 0 5px var(--button-accent);
    }

    .fan-command[aria-disabled="true"] {
      cursor: wait;
    }

    .fan-command[aria-disabled="true"]:not(.is-pending) {
      opacity: .34;
    }

    .fan-command::before {
      position: absolute;
      top: 50%;
      right: calc(100% + 16px);
      z-index: 6;
      width: max-content;
      max-width: 15rem;
      padding: .58rem .78rem;
      border: 1px solid color-mix(in srgb, var(--theme-muted) 50%, transparent);
      border-radius: .45rem;
      color: var(--theme-fg);
      content: attr(data-tip);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: clamp(10px, .72vw, 13px);
      letter-spacing: .01em;
      opacity: 0;
      pointer-events: none;
      background: color-mix(in srgb, var(--theme-bg) 94%, transparent);
      box-shadow: 0 .8rem 2.3rem rgba(0, 0, 0, .34);
      transform: translate(8px, -50%);
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .fan-command:hover::before,
    .fan-command:focus-visible::before {
      opacity: 1;
      transform: translate(0, -50%);
    }

    .glyph {
      position: relative;
      display: grid;
      width: 52%;
      height: 52%;
      place-items: center;
    }

    .glyph svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.2;
    }

    .mode-glyph svg {
      position: absolute;
      inset: 0;
    }

    .mode-control[data-mode="straight"] .natural-icon,
    .mode-control[data-mode="natural"] .straight-icon {
      display: none;
    }

    .speed-glyph {
      font-size: clamp(24px, 2.15vw, 42px);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 720;
      letter-spacing: -.06em;
      line-height: 1;
    }

    .fan-command[data-level="1"] {
      --button-accent: var(--theme-green);
    }

    .fan-command[data-level="2"] {
      --button-accent: var(--theme-cyan);
    }

    .fan-command[data-level="3"] {
      --button-accent: var(--theme-blue);
    }

    .fan-command[data-level="4"] {
      --button-accent: var(--theme-yellow);
    }

    .fan-command[data-role="power"] {
      --button-accent: var(--theme-red);
      margin-bottom: clamp(5px, .45vw, 9px);
    }

    .fan-command[data-role="power"].is-active {
      --button-accent: var(--theme-green);
    }

    .fan-command[data-role="mode"] {
      --button-accent: var(--theme-magenta);
      margin-top: clamp(5px, .45vw, 9px);
    }

    .fan-command[data-role="horizontal"] {
      --button-accent: var(--theme-cyan);
    }

    .fan-command[data-role="vertical"] {
      --button-accent: var(--theme-bright-blue);
    }

    .command-dot {
      position: absolute;
      right: 10%;
      bottom: 10%;
      width: 8px;
      height: 8px;
      border: 2px solid currentColor;
      border-radius: 50%;
      opacity: 0;
      background: currentColor;
      transform: scale(.3);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .fan-command.is-current .command-dot,
    .fan-command.is-active .command-dot {
      opacity: 1;
      transform: scale(1);
    }

    .fan-command.is-pending .glyph {
      opacity: .18;
    }

    .fan-command.is-pending::after {
      position: absolute;
      inset: 22%;
      border: 3px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      content: "";
      animation: spin .72s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(1turn);
      }
    }

    /* G — the closest structural translation of Caelestia's sculpted edge. */
    .variant-g .rail-shell {
      width: clamp(130px, 9.5vw, 160px);
      filter: drop-shadow(-20px 0 38px rgba(0, 0, 0, .48));
    }

    .variant-g .rail-shell::after {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 4px;
      content: "";
      background: var(--theme-blue);
      box-shadow: -4px 0 16px color-mix(in srgb, var(--theme-blue) 36%, transparent);
    }

    .variant-g .icon-stack {
      right: clamp(14px, 1vw, 20px);
      z-index: 2;
      gap: clamp(9px, .72vw, 14px);
      isolation: isolate;
    }

    .variant-g .icon-stack::before,
    .variant-g .icon-stack::after {
      position: absolute;
      content: "";
      pointer-events: none;
      clip-path: polygon(16px 0, 100% 0, 100% 100%, 16px 100%, 0 calc(100% - 16px), 0 16px);
    }

    .variant-g .icon-stack::before {
      inset: -22px -18px;
      z-index: -2;
      background: var(--theme-blue);
      box-shadow: 0 0 18px color-mix(in srgb, var(--theme-blue) 28%, transparent);
    }

    .variant-g .icon-stack::after {
      inset: -20px -16px;
      z-index: -1;
      background: color-mix(in srgb, var(--theme-bg) 82%, var(--theme-black));
    }

    .variant-g .fan-command {
      width: clamp(68px, 5vw, 84px);
      height: clamp(68px, 5vw, 84px);
      border: 1px solid color-mix(in srgb, var(--button-accent) 48%, var(--theme-muted));
      border-radius: .55rem;
      clip-path: polygon(12% 0, 88% 0, 100% 12%, 100% 88%, 88% 100%, 12% 100%, 0 88%, 0 12%);
      color: color-mix(in srgb, var(--button-accent) 66%, var(--theme-fg));
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--theme-selection) 55%, transparent), transparent 58%),
        color-mix(in srgb, var(--theme-black) 90%, transparent);
      box-shadow:
        inset 0 0 0 1px color-mix(in srgb, var(--theme-fg) 5%, transparent),
        inset 0 -12px 24px color-mix(in srgb, var(--button-accent) 7%, transparent);
    }

    .variant-g .fan-command:hover {
      color: var(--theme-fg);
      background: color-mix(in srgb, var(--button-accent) 18%, var(--theme-black));
      box-shadow:
        inset 0 0 0 1px color-mix(in srgb, var(--button-accent) 32%, transparent),
        0 0 18px color-mix(in srgb, var(--button-accent) 26%, transparent);
    }

    .variant-g .fan-command.is-current,
    .variant-g .fan-command.is-active {
      color: color-mix(in srgb, var(--button-accent) 30%, white);
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--button-accent) 33%, transparent), transparent 70%),
        color-mix(in srgb, var(--theme-black) 78%, var(--button-accent));
      box-shadow:
        inset 0 0 0 1px color-mix(in srgb, var(--button-accent) 55%, transparent),
        0 0 10px color-mix(in srgb, var(--button-accent) 58%, transparent),
        0 0 28px color-mix(in srgb, var(--button-accent) 30%, transparent);
    }

    /* H — a detached glass capsule with the same five large hits. */
    .variant-h .rail-shell {
      top: 50%;
      right: clamp(10px, 1vw, 18px);
      width: clamp(88px, 6.5vw, 108px);
      height: auto;
      padding: clamp(12px, 1vw, 18px);
      border: 1px solid color-mix(in srgb, var(--theme-muted) 52%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--theme-black) 82%, transparent);
      box-shadow: 0 1.4rem 4rem rgba(0, 0, 0, .38), inset 0 1px rgba(255, 255, 255, .08);
      backdrop-filter: blur(22px) saturate(130%);
      transform: translateY(-50%);
      animation-name: summon-capsule;
    }

    @keyframes summon-capsule {
      from {
        opacity: .4;
        transform: translate(125%, -50%);
      }
      to {
        opacity: 1;
        transform: translate(0, -50%);
      }
    }

    .variant-h .icon-stack {
      position: relative;
      top: auto;
      gap: clamp(11px, .85vw, 16px);
      transform: none;
    }

    .variant-h .fan-command {
      width: clamp(61px, 4.6vw, 76px);
      height: clamp(61px, 4.6vw, 76px);
      border: 1px solid color-mix(in srgb, var(--button-accent) 26%, transparent);
      border-radius: 50%;
      color: color-mix(in srgb, var(--button-accent) 55%, var(--theme-fg));
      background: color-mix(in srgb, var(--theme-black) 88%, transparent);
    }

    .variant-h .fan-command:hover {
      background: color-mix(in srgb, var(--button-accent) 15%, var(--theme-black));
      box-shadow: 0 .8rem 1.8rem rgba(0, 0, 0, .26);
    }

    .variant-h .fan-command.is-current,
    .variant-h .fan-command.is-active {
      color: color-mix(in srgb, var(--button-accent) 24%, white);
      background: color-mix(in srgb, var(--button-accent) 30%, var(--theme-black));
      box-shadow: 0 0 1.8rem color-mix(in srgb, var(--button-accent) 34%, transparent);
    }

    /* I — no panel at all: five independent pebbles pinned to the edge. */
    .variant-i .rail-shell {
      width: clamp(90px, 6.9vw, 116px);
    }

    .variant-i .rail-shell::after {
      position: absolute;
      top: 32%;
      right: 0;
      bottom: 32%;
      width: 5px;
      border-radius: 999px 0 0 999px;
      content: "";
      background: linear-gradient(var(--theme-yellow), var(--theme-blue));
      box-shadow: 0 0 2rem color-mix(in srgb, var(--theme-yellow) 25%, transparent);
    }

    .variant-i .icon-stack {
      right: clamp(11px, .9vw, 17px);
      z-index: 2;
      gap: clamp(12px, .9vw, 17px);
    }

    .variant-i .fan-command {
      width: clamp(64px, 4.75vw, 80px);
      height: clamp(64px, 4.75vw, 80px);
      border: 1px solid color-mix(in srgb, var(--button-accent) 40%, var(--theme-fg));
      border-radius: 34% 48% 37% 46%;
      color: color-mix(in srgb, var(--button-accent) 55%, var(--theme-fg));
      background: color-mix(in srgb, var(--theme-black) 82%, var(--theme-muted));
      box-shadow: 0 .8rem 2rem rgba(0, 0, 0, .3);
    }

    .variant-i .fan-command:nth-child(even) {
      border-radius: 47% 35% 46% 38%;
    }

    .variant-i .fan-command:hover {
      background: color-mix(in srgb, var(--button-accent) 16%, var(--theme-black));
      box-shadow: 0 1rem 2.4rem rgba(0, 0, 0, .38);
    }

    .variant-i .fan-command.is-current,
    .variant-i .fan-command.is-active {
      color: color-mix(in srgb, var(--button-accent) 25%, white);
      background: color-mix(in srgb, var(--button-accent) 30%, var(--theme-black));
      box-shadow: 0 0 2.3rem color-mix(in srgb, var(--button-accent) 36%, transparent);
    }

    .command-toast {
      position: fixed;
      top: 50%;
      right: clamp(142px, 10.5vw, 184px);
      z-index: 20;
      min-width: 13rem;
      padding: .9rem 1rem;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 1rem;
      color: #e9edf3;
      opacity: 0;
      pointer-events: none;
      background: rgba(8, 10, 13, .92);
      box-shadow: 0 1rem 3rem rgba(0, 0, 0, .35);
      transform: translate(12px, -50%);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .command-toast.is-visible {
      opacity: 1;
      transform: translate(0, -50%);
    }

    .command-toast strong,
    .command-toast span {
      display: block;
    }

    .command-toast strong {
      margin-bottom: .28rem;
      font-size: .84rem;
      font-weight: 620;
    }

    .command-toast span {
      color: #8fa0b4;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: .68rem;
    }

    .prototype-state {
      position: fixed;
      bottom: clamp(18px, 1.8vw, 30px);
      left: clamp(18px, 1.8vw, 30px);
      z-index: 30;
      color: rgba(180, 186, 194, .5);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: clamp(9px, .64vw, 12px);
      letter-spacing: .06em;
      pointer-events: none;
    }

    .prototype-switcher {
      position: fixed;
      bottom: clamp(18px, 1.8vw, 30px);
      left: 50%;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: .4rem;
      padding: .42rem;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 999px;
      color: #eef2f7;
      background: rgba(7, 8, 10, .88);
      box-shadow: 0 1rem 3rem rgba(0, 0, 0, .4);
      transform: translateX(-50%);
      backdrop-filter: blur(18px);
    }

    .prototype-switcher button {
      display: grid;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 50%;
      color: #dce3ec;
      cursor: pointer;
      place-items: center;
      background: rgba(255, 255, 255, .07);
    }

    .prototype-switcher button:hover {
      background: rgba(255, 255, 255, .14);
    }

    .prototype-switcher .theme-cycle {
      width: auto;
      min-width: 7.5rem;
      padding: 0 .8rem;
      border-radius: 999px;
      color: var(--theme-bright-cyan);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: .66rem;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .variant-label {
      min-width: 10.5rem;
      padding: 0 .65rem;
      text-align: center;
      font-size: .75rem;
      font-weight: 620;
      letter-spacing: .015em;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body data-variant="G" data-theme="calliope">
  <main class="desktop">
    <div class="hud-context" aria-hidden="true"></div>
    <div class="ambient-card" aria-hidden="true"></div>

    <section class="variant variant-g" aria-label="Variant G, sculpted edge rail">
      <div class="rail-shell">
        <div class="command-mount"></div>
      </div>
    </section>

    <section class="variant variant-h" aria-label="Variant H, floating capsule rail">
      <div class="rail-shell">
        <div class="command-mount"></div>
      </div>
    </section>

    <section class="variant variant-i" aria-label="Variant I, individual pebble rail">
      <div class="rail-shell">
        <div class="command-mount"></div>
      </div>
    </section>
  </main>

  <template id="command-stack-template">
    <div class="icon-stack" role="group" aria-label="Fan quick commands">
      <span class="stack-trace" aria-hidden="true"></span>
      <button class="fan-command power-control" type="button" data-control="power" data-role="power" data-command="on" data-tip="Turn on · xiaomi-fan on" aria-label="Turn fan on">
        <span class="glyph" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M24 6v18"></path>
            <path d="M14 12.5a16 16 0 1 0 20 0"></path>
          </svg>
        </span>
        <span class="command-dot" aria-hidden="true"></span>
      </button>

      <button class="fan-command" type="button" data-control="level" data-command="level 1" data-level="1" data-tip="Quiet · xiaomi-fan level 1" aria-label="Set quiet speed, level 1">
        <span class="glyph speed-glyph" aria-hidden="true">1</span>
        <span class="command-dot" aria-hidden="true"></span>
      </button>

      <button class="fan-command" type="button" data-control="level" data-command="level 2" data-level="2" data-tip="Medium · xiaomi-fan level 2" aria-label="Set medium speed, level 2">
        <span class="glyph speed-glyph" aria-hidden="true">2</span>
        <span class="command-dot" aria-hidden="true"></span>
      </button>

      <button class="fan-command" type="button" data-control="level" data-command="level 3" data-level="3" data-tip="Fast · xiaomi-fan level 3" aria-label="Set fast speed, level 3">
        <span class="glyph speed-glyph" aria-hidden="true">3</span>
        <span class="command-dot" aria-hidden="true"></span>
      </button>

      <button class="fan-command" type="button" data-control="level" data-command="level 4" data-level="4" data-tip="Turbo · xiaomi-fan level 4" aria-label="Set turbo speed, level 4">
        <span class="glyph speed-glyph" aria-hidden="true">4</span>
        <span class="command-dot" aria-hidden="true"></span>
      </button>

      <button class="fan-command mode-control" type="button" data-control="mode" data-role="mode" data-command="mode natural" data-mode="straight" data-tip="Use natural air · xiaomi-fan mode natural" aria-label="Switch to natural airflow">
        <span class="glyph mode-glyph" aria-hidden="true">
          <svg class="straight-icon" viewBox="0 0 48 48">
            <path d="M8 14h30M8 24h30M8 34h30"></path>
            <path d="m34 10 5 4-5 4M34 20l5 4-5 4M34 30l5 4-5 4"></path>
          </svg>
          <svg class="natural-icon" viewBox="0 0 48 48">
            <path d="M7 14c6-7 11 7 17 0s11 7 17 0M7 24c6-7 11 7 17 0s11 7 17 0M7 34c6-7 11 7 17 0s11 7 17 0"></path>
          </svg>
        </span>
        <span class="command-dot" aria-hidden="true"></span>
      </button>

      <button class="fan-command swing-control" type="button" data-control="horizontal" data-role="horizontal" data-command="swing horizontal off" data-tip="Stop horizontal swing · xiaomi-fan swing horizontal off" aria-label="Stop horizontal swing">
        <span class="glyph" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M7 24h34M7 24l7-7M7 24l7 7M41 24l-7-7M41 24l-7 7"></path>
            <path d="M20 14a11 11 0 0 1 8 20M28 34a11 11 0 0 1-8-20"></path>
          </svg>
        </span>
        <span class="command-dot" aria-hidden="true"></span>
      </button>

      <button class="fan-command swing-control" type="button" data-control="vertical" data-role="vertical" data-command="swing vertical off" data-tip="Stop vertical swing · xiaomi-fan swing vertical off" aria-label="Stop vertical swing">
        <span class="glyph" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M24 7v34M24 7l-7 7M24 7l7 7M24 41l-7-7M24 41l7-7"></path>
            <path d="M14 20a11 11 0 0 1 20 8M34 28a11 11 0 0 1-20-8"></path>
          </svg>
        </span>
        <span class="command-dot" aria-hidden="true"></span>
      </button>
    </div>
  </template>

  <div class="command-toast" id="commandToast" role="status" aria-live="polite">
    <strong id="toastTitle">Command confirmed</strong>
    <span id="toastCommand">xiaomi-fan off</span>
  </div>

  <div class="prototype-state" id="prototypeState">PROTOTYPE · OFF · LEVEL 1 · NO COMMAND SENT</div>

  <nav class="prototype-switcher" aria-label="Prototype variants">
    <button type="button" id="previousVariant" aria-label="Previous variant">←</button>
    <div class="variant-label" id="variantLabel">G — Sculpted edge</div>
    <button type="button" id="nextVariant" aria-label="Next variant">→</button>
    <button class="theme-cycle" type="button" id="cycleTheme" aria-label="Preview next desktop theme">Theme · Calliope</button>
  </nav>

  <script>
    if (new URLSearchParams(window.location.search).has("capture")) {
      document.body.classList.add("capture");
    }

    const variants = ["G", "H", "I"];
    const names = {
      G: "Sculpted edge",
      H: "Floating capsule",
      I: "Bare pebbles"
    };
    const themes = ["calliope", "neon", "cyber"];
    const themeNames = {
      calliope: "Calliope",
      neon: "Neon",
      cyber: "Cyber"
    };
    const state = {
      power: "off",
      level: 1,
      mode: "straight",
      horizontalSwing: true,
      verticalSwing: true,
      pending: false,
      lastCommand: "none"
    };

    const template = document.querySelector("#command-stack-template");
    document.querySelectorAll(".command-mount").forEach((mount) => {
      mount.append(template.content.cloneNode(true));
    });

    const toast = document.querySelector("#commandToast");
    const toastTitle = document.querySelector("#toastTitle");
    const toastCommand = document.querySelector("#toastCommand");
    const prototypeState = document.querySelector("#prototypeState");
    const variantLabel = document.querySelector("#variantLabel");
    const themeLabel = document.querySelector("#cycleTheme");

    function requestedVariant() {
      const value = new URLSearchParams(window.location.search).get("variant")?.toUpperCase();
      return variants.includes(value) ? value : "G";
    }

    function requestedTheme() {
      const value = new URLSearchParams(window.location.search).get("theme")?.toLowerCase();
      return themes.includes(value) ? value : "calliope";
    }

    function setVariant(next) {
      document.body.dataset.variant = next;
      variantLabel.textContent = `${next} — ${names[next]}`;
      const url = new URL(window.location.href);
      url.searchParams.set("variant", next);
      window.history.replaceState({}, "", url);
      renderState();
    }

    function cycleVariant(direction) {
      const current = variants.indexOf(document.body.dataset.variant);
      const next = variants[(current + direction + variants.length) % variants.length];
      setVariant(next);
    }

    function setTheme(next) {
      document.body.dataset.theme = next;
      themeLabel.textContent = `Theme · ${themeNames[next]}`;
      const url = new URL(window.location.href);
      url.searchParams.set("theme", next);
      window.history.replaceState({}, "", url);
      renderState();
    }

    function cycleTheme() {
      const current = themes.indexOf(document.body.dataset.theme);
      setTheme(themes[(current + 1) % themes.length]);
    }

    function renderState() {
      const currentVariant = document.body.dataset.variant;
      const currentTheme = document.body.dataset.theme ?? "calliope";
      prototypeState.textContent = `PROTOTYPE ${currentVariant} · ${currentTheme.toUpperCase()} · ${state.power.toUpperCase()} · L${state.level} · ${state.mode.toUpperCase()} · H${state.horizontalSwing ? "ON" : "OFF"} · V${state.verticalSwing ? "ON" : "OFF"}`;

      document.querySelectorAll(".fan-command").forEach((button) => {
        const control = button.dataset.control;
        let command = button.dataset.command;
        let tip = button.dataset.tip;
        let label = button.getAttribute("aria-label");
        let isCurrent = false;
        let isActive = false;

        if (control === "power") {
          const nextPower = state.power === "on" ? "off" : "on";
          command = nextPower;
          tip = `Turn ${nextPower} · xiaomi-fan ${nextPower}`;
          label = `Turn fan ${nextPower}`;
          isActive = state.power === "on";
        } else if (control === "level") {
          isCurrent = Number(button.dataset.level) === state.level;
        } else if (control === "mode") {
          const nextMode = state.mode === "straight" ? "natural" : "straight";
          command = `mode ${nextMode}`;
          tip = `Use ${nextMode} air · xiaomi-fan mode ${nextMode}`;
          label = `Switch to ${nextMode} airflow`;
          button.dataset.mode = state.mode;
          isActive = state.mode === "natural";
        } else if (control === "horizontal") {
          const nextState = state.horizontalSwing ? "off" : "on";
          command = `swing horizontal ${nextState}`;
          tip = `${nextState === "on" ? "Start" : "Stop"} horizontal swing · xiaomi-fan ${command}`;
          label = `${nextState === "on" ? "Start" : "Stop"} horizontal swing`;
          isActive = state.horizontalSwing;
        } else if (control === "vertical") {
          const nextState = state.verticalSwing ? "off" : "on";
          command = `swing vertical ${nextState}`;
          tip = `${nextState === "on" ? "Start" : "Stop"} vertical swing · xiaomi-fan ${command}`;
          label = `${nextState === "on" ? "Start" : "Stop"} vertical swing`;
          isActive = state.verticalSwing;
        }

        button.dataset.command = command;
        button.dataset.tip = tip;
        button.setAttribute("aria-label", label);
        button.classList.toggle("is-current", isCurrent);
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-disabled", state.pending ? "true" : "false");
      });
    }

    function runPrototypeCommand(button) {
      if (state.pending) return;

      const command = button.dataset.command;
      state.pending = true;
      document.querySelectorAll(`[data-command="${CSS.escape(command)}"]`).forEach((match) => {
        match.classList.add("is-pending");
      });
      toastTitle.textContent = "Sending one command";
      toastCommand.textContent = `xiaomi-fan ${command}`;
      toast.classList.add("is-visible");
      renderState();

      window.setTimeout(() => {
        const control = button.dataset.control;
        if (control === "power") state.power = command;
        if (control === "level") state.level = Number(button.dataset.level);
        if (control === "mode") state.mode = command.endsWith("natural") ? "natural" : "straight";
        if (control === "horizontal") state.horizontalSwing = command.endsWith("on");
        if (control === "vertical") state.verticalSwing = command.endsWith("on");
        state.lastCommand = command;
        state.pending = false;
        document.querySelectorAll(".fan-command").forEach((match) => match.classList.remove("is-pending"));
        toastTitle.textContent = "Fresh readback confirmed";
        renderState();

        window.setTimeout(() => toast.classList.remove("is-visible"), 1200);
      }, 720);
    }

    document.querySelectorAll(".fan-command").forEach((button) => {
      button.addEventListener("click", () => runPrototypeCommand(button));
    });

    document.querySelector("#previousVariant").addEventListener("click", () => cycleVariant(-1));
    document.querySelector("#nextVariant").addEventListener("click", () => cycleVariant(1));
    document.querySelector("#cycleTheme").addEventListener("click", cycleTheme);
    document.addEventListener("keydown", (event) => {
      const target = event.target;
      if (target.matches("input, textarea, [contenteditable]")) return;
      if (event.key === "ArrowLeft") cycleVariant(-1);
      if (event.key === "ArrowRight") cycleVariant(1);
    });

    setTheme(requestedTheme());
    setVariant(requestedVariant());
  </script>
</body>
</html>
