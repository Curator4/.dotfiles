# Auto-generated by theme-render.sh. Layout is shared across all themes.
general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = themeLock, 0.2, 0.9, 0.2, 1
    animation = fade, 1, 2, themeLock
}

background {
    monitor = DP-1
    path = /home/curator/pictures/wallpapers/vertical/mountain-osaka.jpg
    blur_passes = 1
    blur_size = 3
    brightness = 0.95
    vibrancy = 0.22
}

background {
    monitor = DP-2
    path = /home/curator/pictures/wallpapers/static/moonlit-teal-mountains.png
    blur_passes = 1
    blur_size = 3
    brightness = 0.95
    vibrancy = 0.22
}

background {
    monitor = DP-3
    path = /home/curator/pictures/wallpapers/static/dusk-coast-seastacks.jpg
    blur_passes = 1
    blur_size = 3
    brightness = 0.95
    vibrancy = 0.22
}

background {
    monitor = DP-4
    path = /home/curator/pictures/wallpapers/vertical/pier-lake-night.jpg
    blur_passes = 1
    blur_size = 3
    brightness = 0.95
    vibrancy = 0.22
}

input-field {
    monitor = DP-3
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(16, 163, 127, 0.88)
    inner_color = rgba(5, 7, 6, 0.82)
    font_color = rgba(232, 236, 233, 1.0)
    font_family = Hack Nerd Font
    fade_on_empty = false
    placeholder_text = <span foreground="##E8ECE9">Enter Password...</span>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
    check_color = rgba(52, 211, 153, 1.0)
    fail_color = rgba(255, 107, 95, 1.0)
    fail_text = <span foreground="##FF6B5F">Authentication failed!</span>
}

label {
    monitor = DP-3
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(232, 236, 233, 1.0)
    font_size = 120
    font_family = Hack Nerd Font
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor = DP-3
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgba(232, 236, 233, 0.80)
    font_size = 24
    font_family = Hack Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor = DP-3
    text = $USER
    color = rgba(16, 163, 127, 0.88)
