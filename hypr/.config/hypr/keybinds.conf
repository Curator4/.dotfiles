# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, W, exec, rofi -show drun
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, slash, exec, $fileManager
bind = $mainMod, D, exec, discord
bind = $mainMod SHIFT, D, exec, kitty herdr --session dynasty
bind = $mainMod, F, exec, $browser
bind = $mainMod, T, exec, ~/.bin/themis-entry --new-term
bind = $mainMod, N, exec, kitty nvim
bind = $mainMod, M, exec, $spotify
bind = $mainMod, O, exec, obsidian
bind = $mainMod, C, killactive,
bind = $mainMod, I, exec, kitty nvim +$ /home/curator/workspace/ai/household-oc/agents/tactical/data/itinerary.md
bind = $mainMod, X, exec, ~/.config/hypr/scripts/hud-checks.sh
bind = $mainMod SHIFT, I, layoutmsg, togglesplit
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod, Escape, exit,
bind = , F11, fullscreen,

# Move focus with vim keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Swap windows with vim keys
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d

# Promote the focused window into the master slot.
bind = $mainMod SHIFT, N, layoutmsg, swapwithmaster

# Master ratio. Applies to the focused workspace only and is not persisted.
bind = $mainMod, minus, layoutmsg, mfact -0.05
bind = $mainMod, equal, layoutmsg, mfact +0.05
bind = $mainMod SHIFT, T, layoutmsg, orientationcycle left bottom
bind = $mainMod SHIFT, O, layoutmsg, orientationnext

# Cycle through windows in current workspace
bind = $mainMod, TAB, cyclenext,
bind = $mainMod, TAB, bringactivetotop,

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots
bind = $mainMod, S, exec, hyprshot -m region
bind = $mainMod SHIFT, S, exec, hyprshot -m output

# Screen recording (toggle: first press = pick region + start, second press = stop)
bind = $mainMod SHIFT, R, exec, ~/.bin/record-region

# Utilities
bind = $mainMod, P, exec, hyprlock
# Super+Y = quick capture (backlog/itinerary). Super+U family is the focus board:
#   U        = add item (category picker, incl. new category)
#   Shift+U  = toggle the panel
#   Alt+U    = SSH (moved off Shift+U)
# Super+X = checks card (routine ack). Super+Shift+X is caffeine.
# Super+Shift+B = backlog scan-and-check-off (B is bluetooth; Shift+Y is hue).
# Hue lights on Super+Shift+Y.
bind = $mainMod, U, exec, ~/.config/hypr/scripts/hud-focus-add.sh
bind = $mainMod SHIFT, U, exec, eww open --toggle hud
bind = $mainMod ALT, U, exec, $ssh
bind = $mainMod, Y, exec, ~/.config/hypr/scripts/hud-capture.sh
bind = $mainMod SHIFT, Y, exec, ~/.bin/hue toggle
bind = $mainMod SHIFT, B, exec, ~/.config/hypr/scripts/hud-backlog.sh

# Checks card is the same modal as backlog: j/k move, x acks, Escape closes.
# reset is required — without it a failed close leaves every key trapped.
submap = checks
binde = , j, exec, ~/.config/hypr/scripts/hud-checks-nav.sh down
binde = , k, exec, ~/.config/hypr/scripts/hud-checks-nav.sh up
bind = , g, exec, ~/.config/hypr/scripts/hud-checks-nav.sh first
bind = SHIFT, G, exec, ~/.config/hypr/scripts/hud-checks-nav.sh last
bind = , x, exec, ~/.config/hypr/scripts/hud-checks-nav.sh x
bind = , Return, exec, ~/.config/hypr/scripts/hud-checks-nav.sh x
bind = , y, exec, ~/.config/hypr/scripts/hud-checks-nav.sh y
bind = , escape, exec, ~/.config/hypr/scripts/hud-checks.sh close
bind = , q, exec, ~/.config/hypr/scripts/hud-checks.sh close
bind = $mainMod, X, exec, ~/.config/hypr/scripts/hud-checks.sh close
submap = reset

# Sit/stand toggle — declares the transition, HUD footer counts the block with
# away-from-desk time subtracted. Confirms with a short notification because the
# board is often closed when this is pressed.
bind = $mainMod, R, exec, posture
# Caffeine dose picker (coffee mug / Monster). Super+X is checks; this is the
# sibling event logger. Confirms with notify-send (active mg + quiet estimate).
bind = $mainMod SHIFT, X, exec, ~/.config/hypr/scripts/caffeine-menu.sh
bind = $mainMod, period, exec, ~/.config/hypr/scripts/emoji-picker.sh
bind = $mainMod, B, exec, ~/.config/waybar/scripts/bluetooth-menu.sh
# Display warmth (sunsetr) — steps active-period target via ~/.bin/sunset-step.
# Geo schedule lives in ~/.config/sunsetr/sunsetr.toml (systemctl --user sunsetr).
bind = $mainMod, G, exec, ~/.bin/sunset-step warmer
bind = $mainMod SHIFT, G, exec, ~/.bin/sunset-step cooler

# Per-terminal theme switch — reskins the FOCUSED kitty window (Super+F1..F12)
bind = $mainMod, F1,  exec, ~/.dotfiles/bin/.bin/theme-term.sh aegis
bind = $mainMod, F2,  exec, ~/.dotfiles/bin/.bin/theme-term.sh ashen
bind = $mainMod, F3,  exec, ~/.dotfiles/bin/.bin/theme-term.sh calliope
bind = $mainMod, F4,  exec, ~/.dotfiles/bin/.bin/theme-term.sh crimson-gray
bind = $mainMod, F5,  exec, ~/.dotfiles/bin/.bin/theme-term.sh cyber
bind = $mainMod, F6,  exec, ~/.dotfiles/bin/.bin/theme-term.sh ember
bind = $mainMod, F7,  exec, ~/.dotfiles/bin/.bin/theme-term.sh pine
bind = $mainMod, F8,  exec, ~/.dotfiles/bin/.bin/theme-term.sh lavender
bind = $mainMod, F9,  exec, ~/.dotfiles/bin/.bin/theme-term.sh mono
bind = $mainMod, F10, exec, ~/.dotfiles/bin/.bin/theme-term.sh neon
bind = $mainMod, F11, exec, ~/.dotfiles/bin/.bin/theme-term.sh nord
bind = $mainMod, F12, exec, ~/.dotfiles/bin/.bin/theme-term.sh serene

# Global theme switch — repaints the whole desktop (Super+ALT+F1..F12).
# Same theme in the same F-key slot as the per-terminal row above.
# apply restarts waybar, so detach into a transient scope: a bind spawned from
# waybar's own tree would be killed mid-apply, before .current-theme is written.
$themeApply = systemd-run --user --quiet --collect ~/.dotfiles/bin/.bin/theme-switcher.sh apply
bind = $mainMod ALT, F1,  exec, $themeApply aegis
bind = $mainMod ALT, F2,  exec, $themeApply ashen
bind = $mainMod ALT, F3,  exec, $themeApply calliope
bind = $mainMod ALT, F4,  exec, $themeApply crimson-gray
bind = $mainMod ALT, F5,  exec, $themeApply cyber
bind = $mainMod ALT, F6,  exec, $themeApply ember
bind = $mainMod ALT, F7,  exec, $themeApply pine
bind = $mainMod ALT, F8,  exec, $themeApply lavender
bind = $mainMod ALT, F9,  exec, $themeApply mono
bind = $mainMod ALT, F10, exec, $themeApply neon
bind = $mainMod ALT, F11, exec, $themeApply nord
bind = $mainMod ALT, F12, exec, $themeApply serene

# Laptop multimedia keys for volume and LCD brightness.
# Volume snaps to multiples of 5 (see scripts/volume-snap.sh).
bindel = ,XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume-snap.sh up
bindel = ,XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume-snap.sh down
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Volume control with arrow keys
bindel = $mainMod, up, exec, ~/.config/hypr/scripts/volume-snap.sh up
bindel = $mainMod, down, exec, ~/.config/hypr/scripts/volume-snap.sh down

# Media controls with playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Arrow keys + space for media control
bind = $mainMod, left, exec, playerctl -p ncspot,spotify,firefox previous
bind = $mainMod, right, exec, playerctl -p ncspot,spotify,firefox next
bind = $mainMod, space, exec, playerctl -p ncspot,spotify,firefox play-pause

# TTS / desk-ear — nav cluster, no modifier (mute-shaped toggles)
# Insert = shut her up, Home = pause her, Page_Down = talk / stop talking
bindl = , Insert, exec, python3 ~/workspace/ai/tts-daemon/tts_client.py kill
bindl = , Home, exec, python3 ~/workspace/ai/tts-daemon/tts_client.py pause
bindl = , Page_Down, exec, uv run --project /home/curator/workspace/ai/household-oc/tools/speak hark

# Quick emoji shortcuts (Super + Ctrl + key) — clipboard+ydotool paste
