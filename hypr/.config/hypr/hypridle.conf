general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Lua config (0.55+) compiles `hyprctl dispatch` args as Lua source, so the
    # old `dispatch dpms on` is a syntax error and silently no-ops. The table is
    # load-bearing: hl.dsp.dpms("on") parses fine but ignores the string and
    # TOGGLES, which desyncs on the second call.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    # Firefox holds an unconditional org.freedesktop.ScreenSaver lock for any
    # playing media and offers no pref to disable it (moz bug 1749187), which
    # kept resetting the idle timers. Wayland/systemd inhibitors still honored.
    ignore_dbus_inhibit = true
}

listener {
    timeout = 1200
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1500
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
