# Palette for everything below (styling.conf reads $border_active and friends).
# current-theme is a symlink maintained by theme-switcher.sh.
source = ~/.config/current-theme/hyprland.conf
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/programs.conf
source = ~/.config/hypr/styling.conf
source = ~/.config/hypr/theme-effects.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/autostart.conf
