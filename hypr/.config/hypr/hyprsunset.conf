# hyprsunset — DISABLED (migrated to sunsetr, 2026-08-09)
#
# Automatic schedule + native Hyprland CTM is now handled by sunsetr:
#   config:  ~/.config/sunsetr/sunsetr.toml
#   service: systemctl --user {start,stop,restart,status} sunsetr
#   manual:  Super+G / Super+Shift+G → ~/.bin/sunset-step
#            (sunsetr set current_temp±=500 on the active period)
#
# Do NOT re-enable hyprsunset.service alongside sunsetr — both fight over CTM.
# The hyprsunset *binary* may still be used if sunsetr is switched to
#   backend = "hyprsunset"
# but leave this profile file empty of active profiles so an accidental
# `systemctl --user start hyprsunset` does not apply a competing schedule.
#
# Previous schedule (for reference only): day identity ~7:00, evening ramp
# 18:00 5500K → 23:00 2500K (15-min steps). Night floor 2500K for code
# readability (f.lux goes lower). Replaced by geo mode for Copenhagen.
#
# Docs (old): https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/
# Docs (new): https://psi4j.github.io/sunsetr/

# No active profiles — intentional. Accidental hyprsunset start = no-op.
