# Mako colors — jade. Chrome lives in mako/layout.conf.
background-color=#111C18E6
text-color=#C1C497
border-color=#F76B15

[urgency=low]
border-color=#71CEAD
default-timeout=3000

[urgency=normal]
border-color=#F76B15
default-timeout=5000

[urgency=critical]
border-color=#ff6464
background-color=#1a0f0fE6
default-timeout=0
