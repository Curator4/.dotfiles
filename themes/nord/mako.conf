# Mako colors — nord. Chrome lives in mako/layout.conf.
background-color=#2e3440E6
text-color=#d8dee9
border-color=#81A1C1

[urgency=low]
border-color=#88C0D0
default-timeout=3000

[urgency=normal]
border-color=#81A1C1
default-timeout=5000

[urgency=critical]
border-color=#BF616A
background-color=#2e3440E6
default-timeout=0
