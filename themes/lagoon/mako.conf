# Mako colors — Lagoon. Chrome lives in mako/layout.conf.
background-color=#071A1DE6
text-color=#BAD8D6
border-color=#5CD6C6

[urgency=low]
border-color=#5CD6C6
default-timeout=3000

[urgency=normal]
border-color=#5CD6C6
default-timeout=5000

[urgency=critical]
border-color=#E3897D
background-color=#071A1DE6
default-timeout=0
