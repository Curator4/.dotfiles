# Mako colors — Silver. Chrome lives in mako/layout.conf.
background-color=#202429E6
text-color=#D7DFE5
border-color=#D7DFE5

[urgency=low]
border-color=#D7DFE5
default-timeout=3000

[urgency=normal]
border-color=#D7DFE5
default-timeout=5000

[urgency=critical]
border-color=#D19A9D
background-color=#202429E6
default-timeout=0
