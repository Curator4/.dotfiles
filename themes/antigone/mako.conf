# Mako notification daemon config - Antigone (draft via theme-scaffold)
font=JetBrainsMono Nerd Font 12
background-color=#000000E6
text-color=#B0CCDC
border-color=#8FD4FF
border-size=2
border-radius=4
padding=12
margin=10
width=350
height=150
anchor=top-right
default-timeout=5000
ignore-timeout=0
icons=1
max-icon-size=64
icon-path=/usr/share/icons/Adwaita
group-by=app-name
max-visible=5
