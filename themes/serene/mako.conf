# Mako colors — serene. Chrome lives in mako/layout.conf.
background-color=#FFF9F0E6
text-color=#3F4A43
border-color=#4A7F3F

[urgency=low]
border-color=#4A7F3F
default-timeout=3000

[urgency=normal]
border-color=#4A7F3F
default-timeout=5000

[urgency=critical]
border-color=#B85C45
background-color=#FFF9F0E6
default-timeout=0
