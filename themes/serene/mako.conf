# Mako colors — serene. Chrome lives in mako/layout.conf.
background-color=#D6CFC3E6
text-color=#363F39
border-color=#3A6331

[urgency=low]
border-color=#3A6331
default-timeout=3000

[urgency=normal]
border-color=#3A6331
default-timeout=5000

[urgency=critical]
border-color=#8A4534
background-color=#D6CFC3E6
default-timeout=0
