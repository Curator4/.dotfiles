# Mako colors — mono. Chrome lives in mako/layout.conf.
background-color=#101010E6
text-color=#cccccc
border-color=#cccccc

[urgency=low]
border-color=#cccccc
default-timeout=3000

[urgency=normal]
border-color=#cccccc
default-timeout=5000

[urgency=critical]
border-color=#cccccc
background-color=#101010E6
default-timeout=0
