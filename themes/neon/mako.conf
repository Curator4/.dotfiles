# Mako colors — neon. Chrome lives in mako/layout.conf.
background-color=#0d1117E6
text-color=#d8e8ff
border-color=#00f0ff

[urgency=low]
border-color=#00f0ff
default-timeout=3000

[urgency=normal]
border-color=#00f0ff
default-timeout=5000

[urgency=critical]
border-color=#ff2d95
background-color=#0d1117E6
default-timeout=0
