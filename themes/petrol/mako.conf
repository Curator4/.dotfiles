# Mako colors — Petrol. Chrome lives in mako/layout.conf.
background-color=#10252AE6
text-color=#E1ECE8
border-color=#9BBEB5

[urgency=low]
border-color=#9BBEB5
default-timeout=3000

[urgency=normal]
border-color=#9BBEB5
default-timeout=5000

[urgency=critical]
border-color=#CE9C9D
background-color=#10252AE6
default-timeout=0
