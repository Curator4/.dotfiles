# Mako colors — ashen. Chrome lives in mako/layout.conf.
background-color=#121212E6
text-color=#b4b4b4
border-color=#D87C4A

[urgency=low]
border-color=#4A8B8B
default-timeout=3000

[urgency=normal]
border-color=#D87C4A
default-timeout=5000

[urgency=critical]
border-color=#B14242
background-color=#121212E6
default-timeout=0
