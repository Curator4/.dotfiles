# Mako colors — Frost. Chrome lives in mako/layout.conf.
background-color=#E3EDF1E6
text-color=#1D3342
border-color=#13809A

[urgency=low]
border-color=#13809A
default-timeout=3000

[urgency=normal]
border-color=#13809A
default-timeout=5000

[urgency=critical]
border-color=#A8403A
background-color=#E3EDF1E6
default-timeout=0
