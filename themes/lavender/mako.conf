# Mako colors — lavender. Chrome lives in mako/layout.conf.
background-color=#1E1325E6
text-color=#E8D4F7
border-color=#B565D8

[urgency=low]
border-color=#DA70D6
default-timeout=3000

[urgency=normal]
border-color=#B565D8
default-timeout=5000

[urgency=critical]
border-color=#E74C3C
background-color=#1a0f14E6
default-timeout=0
