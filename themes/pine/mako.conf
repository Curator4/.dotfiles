# Mako colors — pine. Chrome lives in mako/layout.conf.
background-color=#050706F2
text-color=#E8ECE9
border-color=#10A37F

[urgency=low]
border-color=#00B8B8
default-timeout=3000

[urgency=normal]
border-color=#10A37F
default-timeout=5000

[urgency=critical]
border-color=#FF6B5F
background-color=#190A09F2
default-timeout=0
